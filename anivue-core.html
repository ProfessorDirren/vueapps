<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANIVUE · VUECORE preview</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:auto;padding:22px;background:#0b1720;color:#f4f7f8}button,select,textarea{font:inherit;padding:12px;border-radius:8px}textarea{box-sizing:border-box;width:100%;min-height:120px}button{cursor:pointer;background:#70d6bb;color:#071920;border:0}section{padding:16px;border:1px solid #456;border-radius:12px;margin:18px 0}a{color:#70d6bb}#answer{white-space:pre-wrap}label{display:block;margin:12px 0}</style></head>
<body><a href="./">← VUEAPPS</a><h1>ANIVUE · VUECORE</h1><p id="preview"></p>
<label>Language <select id="language"><option value="en">English</option><option value="es">Español</option><option value="sv">Svenska</option><option value="hi">हिन्दी</option><option value="zh-CN">简体中文</option><option value="ru">Русский</option><option value="ar">العربية</option></select></label>
<label for="species">Animal <select id="species"><option value="dog">Dog</option><option value="cat">Cat</option><option value="horse">Horse</option></select></label><label for="symptom">Symptom <select id="symptom"></select></label>
<section><label for="photo">Optional photo (JPEG, PNG or WebP, max 3 MB) <input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="photoStatus" role="status"></p></section>
<section><a id="vetlink" href="https://www.google.com/maps/search/emergency+veterinary+hospital" target="_blank" rel="noopener noreferrer">Find an animal hospital</a></section>
<section><p id="safety"></p><p id="status" role="status" aria-live="polite"></p></section>
<form id="ask"><label id="prompt" for="question"></label><textarea id="question" maxlength="3000" required minlength="3"></textarea><button id="send" type="submit"></button></form>
<section id="result" hidden><h2>ANIVUE</h2><div id="answer"></div><p id="disclaimer"></p></section>
<p><a href="https://www.anivueapp.se" rel="noopener noreferrer" id="standalone"></a></p>
<script type="module">
import {ROUTER_TEXT} from './apps/router-content.js';
import {VueFlow} from './core/index.js';
import {AniVueDomain} from './core/anivue.js';
const flow=new VueFlow(new AniVueDomain());
const $=id=>document.getElementById(id),labels={
en:['VUECORE-native ANIVUE preview — not feature-complete.','For breathing difficulty, collapse or severe bleeding, contact emergency veterinary care immediately. Do not wait for AI.','Describe the animal and what you noticed','Ask ANIVUE','AI guidance is not a veterinary diagnosis.','Open full standalone ANIVUE'],
es:['Vista previa ANIVUE en VUECORE — aún no tiene todas las funciones.','Si hay dificultad para respirar, colapso o hemorragia grave, busca atención veterinaria urgente. No esperes a la IA.','Describe el animal y lo que has observado','Preguntar a ANIVUE','La orientación de IA no sustituye al veterinario.','Abrir ANIVUE independiente'],
sv:['ANIVUE i VUECORE — förhandsversion utan full funktionalitet.','Vid andningssvårigheter, kollaps eller kraftig blödning: kontakta akut veterinärvård direkt. Vänta inte på AI.','Beskriv djuret och vad du märkt','Fråga ANIVUE','AI-vägledning ersätter inte veterinärvård.','Öppna fristående ANIVUE'],
hi:['VUECORE ANIVUE पूर्वावलोकन — सभी सुविधाएँ उपलब्ध नहीं।','सांस लेने में कठिनाई, गिरने या गंभीर रक्तस्राव पर तुरंत आपात पशु चिकित्सा लें। AI की प्रतीक्षा न करें।','जानवर और लक्षण बताएँ','ANIVUE से पूछें','AI सलाह पशु चिकित्सक का विकल्प नहीं है।','मूल ANIVUE खोलें'],
'zh-CN':['VUECORE ANIVUE 预览版，功能尚不完整。','呼吸困难、昏倒或严重出血时立即联系急诊兽医，不要等待AI。','描述动物和观察到的情况','询问ANIVUE','AI建议不能替代兽医诊疗。','打开独立ANIVUE'],
ru:['ANIVUE в VUECORE — предварительная версия с неполным набором функций.','При затруднении дыхания, коллапсе или сильном кровотечении срочно обратитесь к ветеринару. Не ждите ИИ.','Опишите животное и симптомы','Спросить ANIVUE','ИИ не заменяет ветеринара.','Открыть отдельный ANIVUE'],
ar:['معاينة ANIVUE في VUECORE — الوظائف غير مكتملة.','عند صعوبة التنفس أو الانهيار أو النزيف الشديد اطلب رعاية بيطرية عاجلة فورًا. لا تنتظر الذكاء الاصطناعي.','صف الحيوان وما لاحظته','اسأل ANIVUE','إرشادات الذكاء الاصطناعي ليست تشخيصًا بيطريًا.','افتح ANIVUE المستقل']};
const photo=$('photo');
let imageData=null;
let photoReadVersion=0;
photo.onchange=async()=>{
 const version=++photoReadVersion;
 imageData=null;
 const file=photo.files?.[0];
 if(!file){$('photoStatus').textContent='';return}
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024||file.size===0){$('photoStatus').textContent='Unsupported image or file exceeds 3 MB.';photo.value='';return}
 try{
  const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
  if(version!==photoReadVersion)return;
  if(typeof data!=='string')throw Error();
  imageData=data;$('photoStatus').textContent='Photo ready. Photo analysis is optional.';
 }catch{if(version===photoReadVersion)$('photoStatus').textContent='Unable to read photo.'}
};
const controls={
 en:['Animal','Symptom','Optional photo (JPEG, PNG or WebP, max 3 MB)','Find an animal hospital','Dog','Cat','Horse','Other','Breathing difficulty'],
 es:['Animal','Síntoma','Foto opcional (JPEG, PNG o WebP, máximo 3 MB)','Buscar un hospital veterinario','Perro','Gato','Caballo','Otro','Dificultad para respirar'],
 sv:['Djur','Symtom','Frivilligt foto (JPEG, PNG eller WebP, högst 3 MB)','Hitta djursjukhus','Hund','Katt','Häst','Annat','Andningssvårigheter'],
 hi:['जानवर','लक्षण','वैकल्पिक फोटो (JPEG, PNG या WebP, अधिकतम 3 MB)','पशु अस्पताल खोजें','कुत्ता','बिल्ली','घोड़ा','अन्य','सांस लेने में कठिनाई'],
 'zh-CN':['动物','症状','可选照片（JPEG、PNG 或 WebP，最大 3 MB）','查找动物医院','狗','猫','马','其他','呼吸困难'],
 ru:['Животное','Симптом','Необязательное фото (JPEG, PNG или WebP, до 3 МБ)','Найти ветеринарную клинику','Собака','Кошка','Лошадь','Другое','Затруднённое дыхание'],
 ar:['الحيوان','العرض','صورة اختيارية (JPEG أو PNG أو WebP، بحد أقصى 3 ميغابايت)','ابحث عن مستشفى بيطري','كلب','قطة','حصان','أخرى','صعوبة التنفس']
};
const photoErrors={
 en:['Photo analysis is temporarily unavailable. Try again later; seek veterinary care promptly for concerning symptoms.','The photo could not be analyzed. Choose a clear JPEG, PNG or WebP image under 3 MB.','Photo analysis limit reached. Try again later; do not delay veterinary care.'],
 es:['El análisis de fotos no está disponible temporalmente. Inténtalo más tarde; ante síntomas preocupantes consulta pronto al veterinario.','No se pudo analizar la foto. Elige una imagen JPEG, PNG o WebP clara de menos de 3 MB.','Se alcanzó el límite de análisis de fotos. Inténtalo más tarde; no retrases la atención veterinaria.'],
 sv:['Bildanalysen är tillfälligt otillgänglig. Försök senare; sök veterinärvård snarast vid oroande symtom.','Bilden kunde inte analyseras. Välj en tydlig JPEG-, PNG- eller WebP-bild under 3 MB.','Gränsen för bildanalyser är nådd. Försök senare; vänta inte med veterinärvård.'],
 hi:['फोटो विश्लेषण अभी उपलब्ध नहीं है। बाद में प्रयास करें; चिंताजनक लक्षणों पर तुरंत पशु चिकित्सक से संपर्क करें।','फोटो का विश्लेषण नहीं हो सका। 3 MB से छोटी स्पष्ट JPEG, PNG या WebP छवि चुनें।','फोटो विश्लेषण की सीमा पूरी हो गई है। बाद में प्रयास करें; पशु चिकित्सा में देरी न करें।'],
 'zh-CN':['图片分析暂时不可用，请稍后重试；如有令人担忧的症状，请尽快就医。','无法分析图片。请选择小于 3 MB 的清晰 JPEG、PNG 或 WebP 图片。','图片分析次数已达上限，请稍后重试；不要延误兽医诊疗。'],
 ru:['Анализ фото временно недоступен. Повторите позже; при тревожных симптомах срочно обратитесь к ветеринару.','Не удалось проанализировать фото. Выберите чёткое изображение JPEG, PNG или WebP размером до 3 МБ.','Лимит анализа фото исчерпан. Повторите позже; не откладывайте ветеринарную помощь.'],
 ar:['تحليل الصور غير متاح مؤقتًا. حاول لاحقًا؛ اطلب الرعاية البيطرية سريعًا عند ظهور أعراض مقلقة.','تعذّر تحليل الصورة. اختر صورة واضحة بصيغة JPEG أو PNG أو WebP بحجم أقل من 3 ميغابايت.','تم بلوغ حد تحليل الصور. حاول لاحقًا؛ لا تؤخر الرعاية البيطرية.']
};
const resultLabels={
 en:['Breed','Age'],es:['Raza','Edad'],sv:['Ras','Ålder'],hi:['नस्ल','उम्र'],'zh-CN':['品种','年龄'],ru:['Порода','Возраст'],ar:['السلالة','العمر']
};
const symptoms={
 dog:[['other','Other'],['breathing','Breathing difficulty']],cat:[['other','Other'],['breathing','Breathing difficulty']],
 horse:[['horseOther','Other'],['horseColic','Colic'],['horseChoke','Choke'],['horseBreathingDistress','Breathing distress'],['horseSevereBleeding','Severe bleeding'],['horseUnableStand','Unable to stand'],['horseNeuro','Neurological symptoms'],['horseEyeTrauma','Eye trauma'],['horseFoalingDifficulty','Foaling difficulty'],['horseCannotBearWeight','Cannot bear weight'],['horseDiarrhea','Diarrhea'],['horseNotEating','Not eating']]
};
const horseTranslations={
 en:['Other','Colic','Choke','Breathing distress','Severe bleeding','Unable to stand','Neurological symptoms','Eye trauma','Foaling difficulty','Cannot bear weight','Diarrhea','Not eating'],
 es:['Otro','Cólico','Obstrucción esofágica','Dificultad respiratoria','Hemorragia grave','No puede levantarse','Síntomas neurológicos','Lesión ocular','Dificultad en el parto','No puede apoyar una extremidad','Diarrea','No come'],
 sv:['Annat','Kolik','Foderstrupsförstoppning','Andningssvårigheter','Kraftig blödning','Kan inte stå upp','Neurologiska symtom','Ögonskada','Fölningsproblem','Kan inte belasta benet','Diarré','Äter inte'],
 hi:['अन्य','पेट दर्द (कोलिक)','भोजन नली में रुकावट','सांस लेने में कठिनाई','गंभीर रक्तस्राव','खड़ा नहीं हो पा रहा','तंत्रिका संबंधी लक्षण','आंख में चोट','प्रसव में कठिनाई','पैर पर वजन नहीं डाल पा रहा','दस्त','खाना नहीं खा रहा'],
 'zh-CN':['其他','疝痛','食道阻塞','呼吸困难','严重出血','无法站立','神经系统症状','眼部外伤','分娩困难','肢体无法负重','腹泻','不进食'],
 ru:['Другое','Колики','Закупорка пищевода','Затруднённое дыхание','Сильное кровотечение','Не может стоять','Неврологические симптомы','Травма глаза','Трудные роды','Не опирается на конечность','Диарея','Не ест'],
 ar:['أخرى','مغص','انسداد المريء','صعوبة التنفس','نزيف شديد','غير قادر على الوقوف','أعراض عصبية','إصابة العين','صعوبة الولادة','لا يستطيع تحميل الوزن على الطرف','إسهال','لا يأكل']
};
function updateSymptoms(){const selected=$('symptom'),previous=selected.value,animal=$('species').value,translated=animal==='horse'?horseTranslations[$('language').value]:null;selected.replaceChildren(...symptoms[animal].map(([id,label],i)=>new Option(translated?.[i]||label,id)));if([...selected.options].some(o=>o.value===previous))selected.value=previous;}
$('species').onchange=updateSymptoms;updateSymptoms();
let busy=false;const picker=$('language');try{const v=localStorage.getItem('vue-language');if(labels[v])picker.value=v}catch{}
function render(){const l=picker.value,t=labels[l],u=controls[l];document.querySelector('label[for="species"]').firstChild.textContent=u[0]+' ';document.querySelector('label[for="symptom"]').firstChild.textContent=u[1]+' ';document.querySelector('label[for="photo"]').firstChild.textContent=u[2]+' ';$('vetlink').textContent=u[3];[...$('species').options].forEach((o,i)=>o.textContent=u[i+4]);updateSymptoms();const symptom=$('symptom');for(const o of symptom.options){if(o.value==='other'||o.value==='horseOther')o.textContent=u[7];if(o.value==='breathing'||o.value==='horseBreathingDistress')o.textContent=u[8];}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('preview').textContent=t[0];$('safety').textContent=t[1];$('prompt').textContent=t[2];$('send').textContent=t[3];$('disclaimer').textContent=t[4];$('standalone').textContent=t[5];}
picker.onchange=()=>{try{localStorage.setItem('vue-language',picker.value)}catch{}render()};render();
$('ask').onsubmit=async event=>{event.preventDefault();if(busy)return;const question=$('question').value.trim();if(question.length<3)return;busy=true;$('send').disabled=true;$('status').textContent=ROUTER_TEXT[picker.value][4];try{const animal=$('species').value;const symptom=$('symptom').value;const check=await flow.run({category:animal,symptoms:[symptom],description:question,language:picker.value});const urgent=check.assessment.severity==='emergency';if(urgent){$('answer').textContent=check.assessment.summary;$('result').hidden=false;$('status').textContent='';if(!imageData)return;}const r=await fetch('/api/vue-router',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(imageData?{action:'anivue_analyze',image:imageData,species:animal,symptoms:[symptom],description:question,language:picker.value}:{question:animal+' '+symptom+' '+question,language:picker.value,previous:'anivue',newCase:true}),signal:AbortSignal.timeout(90000)});if(!r.ok){if(imageData&&[400,413,429,502,503].includes(r.status)){const idx=r.status===429?2:[400,413].includes(r.status)?1:0;throw Error(photoErrors[picker.value][idx]);}throw Error();}const d=await r.json();if(imageData){if(!d.summary||!Array.isArray(d.visibleObservations))throw Error();const aiUrgent=Array.isArray(d.emergencySignals)&&d.emergencySignals.length>0||d.visibleObservations.some(x=>x.significance==='urgent');const aiWarning=aiUrgent?({en:'POSSIBLE EMERGENCY: Contact an emergency veterinarian immediately. Do not wait for AI.',es:'POSIBLE EMERGENCIA: Contacta inmediatamente a un veterinario de urgencias. No esperes a la IA.',sv:'MÖJLIGT AKUTLÄGE: Kontakta akutveterinär omedelbart. Vänta inte på AI.',hi:'संभावित आपात स्थिति: तुरंत आपातकालीन पशु चिकित्सक से संपर्क करें। AI की प्रतीक्षा न करें।','zh-CN':'可能有紧急情况：请立即联系急诊兽医，不要等待 AI。',ru:'ВОЗМОЖНАЯ ЭКСТРЕННАЯ СИТУАЦИЯ: Немедленно обратитесь к дежурному ветеринару. Не ждите ИИ.',ar:'حالة طوارئ محتملة: اتصل بالطبيب البيطري للطوارئ فورًا. لا تنتظر الذكاء الاصطناعي.'})[picker.value]:null;$('answer').textContent=[urgent&&check.assessment.summary,aiWarning,d.emergencyAdvice,d.summary,...d.visibleObservations.map(x=>'• '+x.observation),d.breedAssessment?.likelyBreed&&resultLabels[picker.value][0]+': '+d.breedAssessment.likelyBreed,d.ageAssessment?.estimatedRange&&resultLabels[picker.value][1]+': '+d.ageAssessment.estimatedRange,...(d.limitations||[]),...(d.suggestedFollowUpQuestions||[])].filter(Boolean).join('\n\n');}else{if(d.domain!=='anivue'||!d.answer)throw Error();$('answer').textContent=d.answer;}$('result').hidden=false;$('status').textContent='';}catch(error){$('status').textContent=error?.message&&photoErrors[picker.value].includes(error.message)?error.message:ROUTER_TEXT[picker.value][5]}finally{busy=false;$('send').disabled=false}};
</script></body></html>
