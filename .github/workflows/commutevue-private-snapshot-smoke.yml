name: COMMUTEVUE private signed corridor smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commutevue-private-snapshot-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download private SL regional GTFS
        env:
          TRAFIKLAB_REGIONAL_STATIC_KEY: ${{ secrets.TRAFIKLAB_REGIONAL_STATIC_KEY }}
        run: |
          set -eu
          test -n "$TRAFIKLAB_REGIONAL_STATIC_KEY" || { echo 'Missing static key'; exit 1; }
          node scripts/commutevue-download-regional-gtfs.mjs "$RUNNER_TEMP/regional.zip"
      - name: Build signed corridor and validate runtime provisioning
        env:
          COMMUTEVUE_SNAPSHOT_SIGNING_KEY: ${{ secrets.COMMUTEVUE_SNAPSHOT_SIGNING_KEY }}
        run: |
          set -eu
          test -n "$COMMUTEVUE_SNAPSHOT_SIGNING_KEY" || { echo 'Missing signing key'; exit 1; }
          node scripts/commutevue-build-regional-snapshot.mjs "$RUNNER_TEMP/regional.zip" "$RUNNER_TEMP/corridor.json" "$RUNNER_TEMP/manifest.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {loadRegionalSnapshotFromEnvironment} from "./core/commutevue-regional-runtime-artifact.js";
            import {stockholmServiceDate} from "./scripts/commutevue-build-regional-snapshot.mjs";
            const manifest=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/manifest.json","utf8"));
            const snapshot=loadRegionalSnapshotFromEnvironment({
              encodedEnvelope:manifest.COMMUTVUE_REGIONAL_SIGNED_SNAPSHOT_BASE64,
              signingKey:process.env.COMMUTEVUE_SNAPSHOT_SIGNING_KEY,
              expectedServiceDate:stockholmServiceDate()
            });
            if(snapshot.status!=="validated")throw Error("Runtime snapshot validation failed: "+snapshot.reason);
            const origin=new Set(manifest.COMMUTVUE_REGIONAL_ORIGIN_STOP_IDS.split(","));
            const dest=new Set(manifest.COMMUTVUE_REGIONAL_DESTINATION_STOP_IDS.split(","));
            const ids=new Set([...snapshot.tripStops.values()].flat());
            if(![...origin].some(x=>ids.has(x))||![...dest].some(x=>ids.has(x)))throw Error("Station IDs missing from signed trips");
            console.log(JSON.stringify({status:"runtime_provisioning_verified",activeCorridorTrips:snapshot.tripStops.size,artifactBytes:Buffer.byteLength(readFileSync(process.env.RUNNER_TEMP+"/corridor.json"))}));
          '
      - name: Verify signed regional GTFS against actual live GTFS-RT
        env:
          COMMUTEVUE_SNAPSHOT_SIGNING_KEY: ${{ secrets.COMMUTEVUE_SNAPSHOT_SIGNING_KEY }}
          TRAFIKLAB_REGIONAL_REALTIME_KEY: ${{ secrets.TRAFIKLAB_REGIONAL_REALTIME_KEY }}
        run: |
          set -eu
          test -n "$TRAFIKLAB_REGIONAL_REALTIME_KEY" || { echo 'Missing realtime key'; exit 1; }
          node scripts/commutevue-private-live-join-smoke.mjs "$RUNNER_TEMP/manifest.json"
      - name: Stage bounded signed configuration for private provisioning
        run: |
          set -eu
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const manifest=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/manifest.json","utf8"));
            const allowed=["COMMUTVUE_REGIONAL_SIGNED_SNAPSHOT_BASE64","COMMUTVUE_REGIONAL_ORIGIN_STOP_IDS","COMMUTVUE_REGIONAL_DESTINATION_STOP_IDS"];
            if(Object.keys(manifest).length!==3||allowed.some(k=>typeof manifest[k]!=="string"||!manifest[k]))throw Error("Unexpected provisioning manifest fields");
            writeFileSync(process.env.RUNNER_TEMP+"/commutevue-provisioning.json",JSON.stringify(Object.fromEntries(allowed.map(k=>[k,manifest[k]]))),{mode:0o600,flag:"wx"});
            console.log("Private signed corridor manifest staged (no API keys or signing key)");
          '
      - name: Upload short-lived private provisioning manifest
        uses: actions/upload-artifact@v4
        with:
          name: commutevue-private-signed-corridor
          path: ${{ runner.temp }}/commutevue-provisioning.json
          retention-days: 1
          if-no-files-found: error
      - name: Delete private archive and signed artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/regional.zip" "$RUNNER_TEMP/regional.zip.partial" "$RUNNER_TEMP/corridor.json" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/commutevue-provisioning.json"
