name: COMMUTVUE signed daily corridor snapshot

on:
  workflow_dispatch:
  schedule:
    # 05:15 Stockholm winter / 06:15 summer; higher chance of live commuter trains.
    - cron: '15 4 * * *'

permissions:
  contents: write

concurrency:
  group: commutevue-daily-signed-corridor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download private GTFS
        env:
          TRAFIKLAB_REGIONAL_STATIC_KEY: ${{ secrets.TRAFIKLAB_REGIONAL_STATIC_KEY }}
        run: |
          set -eu
          test -n "$TRAFIKLAB_REGIONAL_STATIC_KEY"
          node scripts/commutevue-download-regional-gtfs.mjs "$RUNNER_TEMP/regional.zip"
      - name: Build and authenticate current traffic-day snapshot
        env:
          COMMUTEVUE_SNAPSHOT_SIGNING_KEY: ${{ secrets.COMMUTEVUE_SNAPSHOT_SIGNING_KEY }}
        run: |
          set -eu
          test -n "$COMMUTEVUE_SNAPSHOT_SIGNING_KEY"
          node scripts/commutevue-build-regional-snapshot.mjs "$RUNNER_TEMP/regional.zip" "$RUNNER_TEMP/corridor.json" "$RUNNER_TEMP/manifest.json"
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            import {gzipSync} from "node:zlib";
            import {verifySignedRegionalSnapshot} from "./core/commutevue-regional-snapshot-auth.js";
            import {stockholmServiceDate} from "./scripts/commutevue-build-regional-snapshot.mjs";
            const envelope=readFileSync(process.env.RUNNER_TEMP+"/corridor.json");
            const snapshot=verifySignedRegionalSnapshot(envelope.toString("utf8"),{key:process.env.COMMUTEVUE_SNAPSHOT_SIGNING_KEY,expectedServiceDate:stockholmServiceDate()});
            if(snapshot.status!=="validated")throw Error("Signed snapshot verification failed");
            const compressed=gzipSync(envelope,{level:9});
            if(compressed.length>16*1024)throw Error("Signed snapshot too large for bounded runtime file");
            writeFileSync(process.env.RUNNER_TEMP+"/corridor.gz",compressed,{mode:0o600,flag:"wx"});
            console.log(JSON.stringify({status:"signed_daily_snapshot_validated",serviceDate:snapshot.serviceDate,trips:snapshot.tripStops.size,compressedBytes:compressed.length}));
          '
      - name: Publish signed data-only file to private repository
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cp "$RUNNER_TEMP/corridor.gz" core/commutevue-regional-signed-snapshot.gz
          git add core/commutevue-regional-signed-snapshot.gz
          if git diff --cached --quiet; then
            echo "Signed snapshot unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(COMMUTVUE): refresh signed regional corridor snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GitHub Actions commits made with GITHUB_TOKEN do not trigger other
      # GitHub workflows. A separately configured Vercel Deploy Hook can
      # request a production rebuild when the daily signed file changes.
      # Leave the secret unset until the free-tier deployment budget is safe.
      - name: Request Vercel rebuild when deploy hook is configured
        if: ${{ steps.publish.outputs.changed == 'true' }}
        env:
          COMMUTVUE_VERCEL_DEPLOY_HOOK: ${{ secrets.COMMUTVUE_VERCEL_DEPLOY_HOOK }}
        run: |
          set -eu
          if [ -z "$COMMUTVUE_VERCEL_DEPLOY_HOOK" ]; then
            echo "Deploy hook not configured; signed snapshot committed without automatic Vercel rebuild"
            exit 0
          fi
          case "$COMMUTVUE_VERCEL_DEPLOY_HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *) echo "Invalid Vercel deploy hook URL"; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 20 --retry 2 --request POST "$COMMUTVUE_VERCEL_DEPLOY_HOOK" >/dev/null
          echo "Vercel deploy hook invoked"
      # A transient GTFS-RT outage or a time window with no predicted departures
      # must not prevent today's authenticated static GTFS artifact from publishing.
      # This smoke check still fails the job if route proof is unavailable, but runs
      # only after the already validated signed snapshot has been committed.
      - name: Verify live GTFS-RT join after publishing
        env:
          COMMUTEVUE_SNAPSHOT_SIGNING_KEY: ${{ secrets.COMMUTEVUE_SNAPSHOT_SIGNING_KEY }}
          TRAFIKLAB_REGIONAL_REALTIME_KEY: ${{ secrets.TRAFIKLAB_REGIONAL_REALTIME_KEY }}
        run: |
          set -eu
          test -n "$TRAFIKLAB_REGIONAL_REALTIME_KEY"
          node scripts/commutevue-private-live-join-smoke.mjs "$RUNNER_TEMP/manifest.json"
      - name: Remove private temporary files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/regional.zip" "$RUNNER_TEMP/regional.zip.partial" "$RUNNER_TEMP/corridor.json" "$RUNNER_TEMP/corridor.gz" "$RUNNER_TEMP/manifest.json"
