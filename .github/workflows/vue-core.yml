name: VUE CORE tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run VUE CORE tests
        run: node --test core/core.test.mjs
